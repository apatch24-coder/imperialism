<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1897년, 증기선을 탄 소년 | 5개의 장면으로 보는 제국주의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAF0EC; --surface:#FFFFFF; --ink:#1B292D; --ink-2:#4C5D60; --line:#C6D2CD;
  --sea:#2A6A6E; --on-sea:#FFFFFF; --sea-tint:#D8E9E7; --brass:#9C6614; --brass-tint:#F2E4C9;
  --good:#2C7547; --good-tint:#DBEEE1; --bad:#A0402E; --bad-tint:#F5DFD8;
  --land:#D3DCD2; --land-edge:#B4C1B5; --water:#DFE9E8;
  --serif:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10181A; --surface:#172225; --ink:#E3ECE8; --ink-2:#A3B3AF; --line:#2D3C3F;
    --sea:#79BDBD; --on-sea:#0F1A1C; --sea-tint:#1C3335; --brass:#DDA94E; --brass-tint:#3A2D17;
    --good:#72C792; --good-tint:#1A3224; --bad:#E89079; --bad-tint:#3C221C;
    --land:#26332F; --land-edge:#36463F; --water:#152022;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10181A; --surface:#172225; --ink:#E3ECE8; --ink-2:#A3B3AF; --line:#2D3C3F;
  --sea:#79BDBD; --on-sea:#0F1A1C; --sea-tint:#1C3335; --brass:#DDA94E; --brass-tint:#3A2D17;
  --good:#72C792; --good-tint:#1A3224; --bad:#E89079; --bad-tint:#3C221C;
  --land:#26332F; --land-edge:#36463F; --water:#152022;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:19px;line-height:1.75;-webkit-font-smoothing:antialiased;}
img,svg{max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px;border-radius:6px;}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 72px;}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:15px;color:var(--ink-2);}
.bar .who{margin-left:auto;white-space:nowrap;}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;}
.progress span{display:block;height:100%;background:var(--sea);border-radius:4px;transition:width .4s ease;}

/* map */
.chart{background:var(--water);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.chart svg{display:block;width:100%;height:auto;}
.chart.compact svg{max-height:210px;margin:0 auto;}
.map-caption{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--ink-2);padding:8px 4px 0;}

h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,6vw,42px);line-height:1.3;margin:22px 0 6px;letter-spacing:-.01em;}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(24px,4.6vw,30px);line-height:1.35;margin:4px 0 12px;}
h3{font-size:20px;margin:0 0 8px;}
.sub{color:var(--ink-2);margin:0 0 18px;}
.eyebrow{font-size:16px;color:var(--brass);margin:20px 0 2px;}
p{margin:0 0 14px;}
.story p{font-family:var(--serif);font-size:20px;line-height:1.95;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 8px;margin:16px 0;}
.note{font-size:16px;color:var(--ink-2);}

/* form */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
.field label{display:block;font-size:16px;color:var(--ink-2);margin-bottom:4px;}
.field select,.field input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:19px;min-height:52px;}
.field.full{grid-column:1/-1;}
@media (max-width:460px){.form-grid{grid-template-columns:1fr 1fr;}.form-grid .field:nth-child(3){grid-column:1/-1;}}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center;}
.btn{border:0;border-radius:12px;padding:14px 24px;min-height:54px;font-size:19px;cursor:pointer;background:var(--sea);color:var(--on-sea);}
.btn:disabled{opacity:.38;cursor:not-allowed;}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn.brass{background:var(--brass);color:var(--surface);}
.btn.wide{flex:1;}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:16px;cursor:pointer;}
.icon-btn[aria-pressed="true"]{background:var(--sea-tint);border-color:var(--sea);}

/* step dots */
.steps{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap;}
.steps span{font-size:14px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);}
.steps span.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.steps span.done{color:var(--sea);border-color:var(--sea);}

/* terms */
.term{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--brass);text-decoration-thickness:2px;text-underline-offset:5px;cursor:pointer;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));}
.sheet .card{max-width:640px;margin:0 auto;background:var(--surface);border:1.5px solid var(--brass);border-radius:16px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.18);}
.sheet .card strong{font-family:var(--serif);font-size:21px;}
.sheet .card p{margin:6px 0 10px;}

/* options */
.options{display:grid;gap:12px;margin-top:8px;}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;font-size:19px;line-height:1.6;}
.opt .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sea-tint);color:var(--sea);font-weight:700;}
.opt[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-tint);}
.opt[aria-pressed="true"] .num{background:var(--sea);color:var(--on-sea);}
.question{font-size:21px;font-weight:700;margin:6px 0 10px;}

/* photos */
.photo{margin:16px 0 8px;}
.photo .zoom{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:zoom-in;}
.photo img{display:block;width:100%;height:auto;}
.photo figcaption{font-family:var(--sans);font-size:15px;color:var(--ink-2);margin-top:6px;line-height:1.5;}
.photo.small{max-width:360px;margin:0 0 12px;}

/* writing */
.frame{background:var(--brass-tint);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
textarea{width:100%;min-height:120px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:19px;line-height:1.7;resize:vertical;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;}
.chip{border:1.5px dashed var(--brass);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:17px;cursor:pointer;}
.count{font-size:15px;color:var(--ink-2);text-align:right;}
.count.ok{color:var(--good);}

/* history */
.verdict{border-radius:12px;padding:14px 16px;margin:10px 0;}
.kinds{display:grid;gap:8px;margin:10px 0 16px;}
.kind{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:17px;line-height:1.55;}
.kind.mine{border:2px solid var(--sea);background:var(--sea-tint);}
.tag{flex:none;font-size:13px;padding:2px 9px;border-radius:999px;white-space:nowrap;margin-top:2px;}
.tag.real{background:var(--brass-tint);color:var(--brass);}
.tag.other{background:var(--sea-tint);color:var(--sea);}
.tag.myth{background:var(--bad-tint);color:var(--bad);}
.fact{border-left:5px solid var(--brass);background:var(--surface);padding:14px 16px;border-radius:0 12px 12px 0;}
.fact .src{font-size:15px;color:var(--ink-2);margin:0;}

/* OX */
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
.ox button{font-family:var(--serif);font-size:56px;line-height:1;padding:22px 0;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;}
.ox button.right{border-color:var(--good);background:var(--good-tint);color:var(--good);}
.ox button.wrong{border-color:var(--bad);background:var(--bad-tint);color:var(--bad);}
.good{background:var(--good-tint);color:var(--ink);}
.bad{background:var(--bad-tint);color:var(--ink);}

/* map card modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,20,22,.55);display:grid;place-items:center;padding:16px;}
.modal .card{background:var(--surface);border-radius:18px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto;}
.modal .owners{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
.modal .owners span{background:var(--brass-tint);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:16px;}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;}
.match .col{display:grid;gap:10px;align-content:start;}
.mbtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;min-height:56px;font-size:19px;cursor:pointer;text-align:center;}
.mbtn.sel{border-color:var(--sea);background:var(--sea-tint);}
.mbtn.done{border-color:var(--good);background:var(--good-tint);cursor:default;}
.mbtn.shake{border-color:var(--bad);animation:shake .35s;}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* quiz */
.qopts{display:grid;gap:10px;margin-top:10px;}
.qopt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:19px;cursor:pointer;}
.qopt.right{border-color:var(--good);background:var(--good-tint);}
.qopt.wrong{border-color:var(--bad);background:var(--bad-tint);}
.qopt:disabled{cursor:default;color:var(--ink);opacity:1;}

/* stars */
.stars{display:flex;gap:10px;margin:8px 0 14px;}
.stars button{font-size:40px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:4px;}
.stars button.on{color:var(--brass);}

/* letter */
.letter-preview{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 22px;font-family:var(--serif);font-size:19px;line-height:2;white-space:pre-wrap;box-shadow:inset 0 0 0 6px var(--paper);}

/* result */
.table-wrap{overflow-x:auto;margin:10px 0 18px;}
table.rt{border-collapse:collapse;width:100%;min-width:560px;font-size:16px;line-height:1.55;background:var(--surface);}
.rt th,.rt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
.rt th{background:var(--sea-tint);}
.msg{margin-top:12px;font-size:17px;}
.msg.err{color:var(--bad);}
.msg.ok{color:var(--good);}

/* report (PDF source, always light) */
#report{position:fixed;left:-10000px;top:0;width:720px;background:#fff;color:#111;font-family:var(--sans);font-size:15px;line-height:1.65;}
#report .rs{padding:4px 2px 10px;background:#fff;}
#report h4{font-family:var(--serif);font-size:20px;margin:0 0 8px;color:#111;}
#report h5{font-size:16px;margin:0 0 4px;color:#111;}
#report table{border-collapse:collapse;width:100%;}
#report td,#report th{border:1px solid #9aa6a3;padding:6px 9px;text-align:left;vertical-align:top;color:#111;}
#report th{background:#e6efed;width:18%;}
#report .box{border:1px solid #9aa6a3;border-radius:6px;padding:10px 12px;}
#report .title{font-family:var(--serif);font-size:24px;font-weight:700;margin:0 0 2px;}
#report .muted{color:#555;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

  {q:"나라와 식민지를 바르게 짝지은 것은?", o:["영국 - 필리핀","미국 - 필리핀","네덜란드 - 인도","프랑스 - 인도네시아"], a:1, ex:"미국은 필리핀, 영국은 인도, 네덜란드는 인도네시아, 프랑스는 인도차이나를 차지했어요.", hint:4},
  {q:"제국주의 시대 식민지의 모습으로 옳은 것은?", o:["식량이 넘쳐났다","원료 공급지와 상품 시장이 되었다","스스로 왕을 뽑았다","공장이 많아져 부자가 되었다"], a:1, ex:"식민지는 원료를 대 주고 물건을 사 주는 곳이 되었어요.", hint:4}
];

/* ---------------- 상태 ---------------- */
const KEY = "imperialism-voyage-v1";
const fresh = () => ({
  info:{grade:"",cls:"",num:"",name:"",date:""},
  screen:"start", scene:0, step:0,
  choices:[null,null,null,null,null], reasons:["","","","",""], ox:[null,null,null,null,null],
  card:false,
  match:{done:[], sel:null},
  letter:["","",""],
  quiz:{idx:0, answers:[], picked:null, best:null, bestAnswers:null, finished:false, hintOpen:false},
  self:{stars:0, note:""}
});
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

/* ---------------- 유틸 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const terms = s => esc(s).replace(/\[\[(.+?)\]\]/g, (_, t) => `<button type="button" class="term" data-term="${t}">${t}</button>`);
const plain = s => String(s).replace(/\[\[(.+?)\]\]/g, "$1");
const len = s => (s || "").replace(/\s/g, "").length;
const MIN = 10;
function photo(p, small) {
  if (!p) return "";
  return `<figure class="photo${small ? " small" : ""}"><button type="button" class="zoom" data-zoom="${p.src}" aria-label="그림 크게 보기"><img src="${IMGS[p.src]}" alt="${esc(p.alt)}"></button><figcaption>${esc(p.cap)}</figcaption></figure>`;
}

/* ---------------- 지도 ---------------- */
const P = (lon, lat) => [((lon + 20) * 4).toFixed(1), ((60 - lat) * 4).toFixed(1)];
const poly = pts => "M" + pts.map(p => P(p[0], p[1]).join(" ")).join("L") + "Z";
const line = pts => "M" + pts.map(p => P(p[0], p[1]).join(" ")).join("L");
const LAND = [
 [[-17,21],[-17,14],[-12,8],[-8,4.5],[-2,5],[5,6],[9,4],[9,-1],[12,-6],[13,-12],[12,-17],[15,-27],[18,-34.5],[20,-35],[26,-34],[31,-29],[35,-24],[40,-15],[40,-10],[39,-5],[42,0],[46,2],[51,11],[43,12],[39,15],[37,21],[34,28],[32,31],[25,32],[20,31],[11,33],[10,37],[0,36],[-6,35.8],[-10,30],[-13,27]],
 [[-10,36],[-9,43],[-2,43.5],[-4,48],[2,51],[5,53],[8,54],[10,57],[12,56],[20,55],[28,60],[134,60],[134,43],[130,42],[121,40],[122,37],[120,32],[122,30],[118,24],[110,21],[108,21],[106,18],[109,12],[105,9],[103,10],[101,13],[100,7],[103,1.5],[101,3],[98,8],[97,17],[94,19],[92,22],[88,22],[86,20],[80,15],[80,10],[77,8],[73,16],[72,21],[67,24],[61,25],[57,26],[56,24],[59,22],[52,16],[45,13],[43,13],[39,21],[35,28],[34,31],[36,36],[30,36.5],[27,37],[26,40],[23,39],[22,37],[20,40],[19,42],[14,45],[12,44],[16,40],[15,38],[10,44],[5,43],[3,43],[0,39],[-2,37],[-5,36]],
 [[-5,50],[1.5,51],[0,53],[-2,56],[-5,58.5],[-6,56],[-3,54.5],[-5,52]],
 [[95,5],[98,4],[106,-6],[104,-6],[100,-1]],
 [[105,-6],[114,-7],[114,-8.5],[106,-7.5]],
 [[109,2],[117,7],[119,1],[116,-4],[110,-3]],
 [[120,18.5],[122,18],[121,14],[124,12],[126,7],[122,7],[120,14]],
 [[44,-25],[47,-25],[50,-15],[49,-12],[44,-17]]
];
const PLACES = {
  london:[-0.1,51.5,"런던"], safrica:[24.8,-28.7,"남아프리카"], congo:[15.3,-4.3,"콩고"],
  fashoda:[32.1,9.9,"파쇼다"], india:[88.4,22.6,"인도"], sea:[106.7,10.8,"동남아시아"]
};
const COLONY_PT = {"인도":[78,22],"인도차이나 (베트남)":[106.7,14],"인도네시아":[110,-7.2],"필리핀":[122,13]};
const LEGS = [
  null, null,
  [[-0.1,51.5],[-12,44],[-19,22],[-14,8],[2,1],[9,-12],[13,-30],[20,-36.5],[24.8,-28.7]],
  [[24.8,-28.7],[33,-31],[41,-17],[44,-2],[52,10],[44,12.6],[38,18],[32.1,9.9]],
  [[32.1,9.9],[37,19.6],[43,12.6],[55,13],[72,8],[80,5],[86,12],[88.4,22.6],[92,15],[97,5],[103,2],[106,6],[106.7,10.8]]
];
const SCENE_PT = ["london","london","safrica","fashoda","india"];

function mapSvg({upto = -1, current = -1, matched = [], compact = false} = {}) {
  const land = LAND.map(p => `<path d="${poly(p)}" fill="var(--land)" stroke="var(--land-edge)" stroke-width="1"/>`).join("");
  const grid = [0,30,60,90,120].map(l => { const x = P(l,0)[0]; return `<line x1="${x}" x2="${x}" y1="0" y2="392" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 5"/>`; }).join("")
    + [45,15,-15].map(l => { const y = P(0,l)[1]; return `<line x1="0" x2="620" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width=".6" stroke-dasharray="2 5"/>`; }).join("");
  const eqY = P(0,0)[1];
  let legs = "";
  LEGS.forEach((lg, i) => {
    if (!lg) return;
    if (i <= upto) legs += `<path d="${line(lg)}" fill="none" stroke="var(--brass)" stroke-width="2.4" stroke-dasharray="1 6" stroke-linecap="round"/>`;
    else if (current < 0 && upto < 0) legs += `<path d="${line(lg)}" fill="none" stroke="var(--brass)" stroke-opacity=".55" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>`;
  });
  const visitedKeys = new Set();
  for (let i = 0; i <= Math.max(upto, current); i++) visitedKeys.add(SCENE_PT[i]);
  if (upto >= 2) visitedKeys.add("congo");
  if (upto >= 4) visitedKeys.add("sea");
  const showAll = upto < 0 && current < 0;
  let pts = "";
  Object.entries(PLACES).forEach(([k, [lon, lat, name]]) => {
    if (!showAll && !visitedKeys.has(k)) return;
    const [x, y] = P(lon, lat);
    const isCur = current >= 0 && SCENE_PT[current] === k;
    const anchor = (k === "india" || k === "sea" || k === "fashoda") ? "start" : "start";
    const dx = 11, dy = k === "sea" ? 24 : k === "congo" ? 20 : -8;
    const hideLabel = matched.length && (k === "india" || k === "sea");
    pts += `<g>${isCur ? `<circle cx="${x}" cy="${y}" r="17" fill="var(--sea)" fill-opacity=".22"/>` : ""}
      <circle cx="${x}" cy="${y}" r="${isCur ? 8 : 6.5}" fill="${isCur ? "var(--sea)" : "var(--surface)"}" stroke="var(--sea)" stroke-width="2.2"/>
      ${hideLabel ? "" : `<text x="${+x + dx}" y="${+y + dy}" font-size="21" fill="var(--ink)" font-family="Gowun Dodum, sans-serif" text-anchor="${anchor}" paint-order="stroke" stroke="var(--water)" stroke-width="5">${name}</text>`}</g>`;
  });
  matched.forEach(c => {
    const pt = COLONY_PT[c]; if (!pt) return;
    const m = MATCH.find(z => z.colony === c);
    const [x, y] = P(pt[0], pt[1]);
    pts += `<g><rect x="${x - 7}" y="${y - 7}" width="14" height="14" rx="3" fill="var(--good)"/>
      <text x="${+x + (c === "필리핀" ? 0 : c === "인도차이나 (베트남)" ? -12 : 11)}" y="${+y + (c === "필리핀" ? -14 : 7)}" text-anchor="${c === "필리핀" ? "middle" : c === "인도차이나 (베트남)" ? "end" : "start"}" font-size="20" fill="var(--ink)" font-family="Gowun Dodum, sans-serif" paint-order="stroke" stroke="var(--water)" stroke-width="5">${esc(m.country)}</text></g>`;
  });
  const vb = "0 0 620 392";
  return `<svg viewBox="${vb}" role="img" aria-label="톰의 항해 지도">
    <rect x="0" y="0" width="620" height="392" fill="var(--water)"/>${grid}
    <line x1="0" x2="620" y1="${eqY}" y2="${eqY}" stroke="var(--brass)" stroke-opacity=".35" stroke-width="1"/>
    ${land}${legs}${pts}</svg>`;
}

/* ---------------- 진행률 ---------------- */
function progressPct() {
  let done = 0; const total = 25 + 4;
  if (S.screen === "scene") done = S.scene * 5 + S.step;
  else if (S.screen === "match") done = 25;
  else if (S.screen === "letter") done = 26;
  else if (S.screen === "quiz") done = 27;
  else if (S.screen === "self") done = 28;
  else if (S.screen === "result") done = 29;
  return Math.round(done / total * 100);
}
function topBar(label) {
  const i = S.info;
  return `<div class="bar"><span>${esc(label)}</span><div class="progress" aria-label="진행률 ${progressPct()}%"><span style="width:${progressPct()}%"></span></div>
    <span class="who">${esc(i.grade)}-${esc(i.cls)} ${esc(i.num)}번 ${esc(i.name)}</span></div>`;
}

/* ---------------- 화면 ---------------- */
function render() {
  stopSpeak();
  const app = $("#app");
  const fn = {start:viewStart, scene:viewScene, match:viewMatch, letter:viewLetter, quiz:viewQuiz, self:viewSelf, result:viewResult}[S.screen] || viewStart;
  app.innerHTML = fn();
  bind();
  save();
}

function viewStart() {
  const i = S.info;
  const opts = (n, v) => `<option value="">선택</option>` + Array.from({length:n}, (_, k) => `<option ${String(k+1) === v ? "selected" : ""}>${k+1}</option>`).join("");
  const resumed = S.choices.some(c => c !== null) || S.screen !== "start";
  return `
  <h1>1897년, 증기선을 탄 소년</h1>
  <p class="sub">다섯 개의 장면으로 보는 제국주의</p>
  <div class="chart">${mapSvg()}</div>
  <div class="map-caption"><span>런던에서 출발해 아프리카와 아시아를 지나는 톰의 항로</span><span>교과서 156~159쪽</span></div>
  <div class="panel story">
    <p>당신은 영국 런던에 사는 14살 견습 선원 <b>톰</b>이에요. 증기선을 타고 아프리카와 아시아를 지나며 제국주의 시대의 모습을 직접 보게 돼요.</p>

    <p class="note">톰은 당시 사람들의 모습을 바탕으로 만든 가상 인물이에요. 밑줄 친 낱말을 누르면 뜻을 볼 수 있어요.</p>

  <div class="actions">
    <button class="btn wide" id="go" disabled>${resumed ? "이어서 하기" : "항해 시작하기"}</button>
    ${resumed ? `<button class="btn ghost" id="reset">처음부터 다시</button>` : ""}
  </div>
  <p class="msg" id="start-msg"></p>`;
}

function viewScene() {
  const sc = SCENES[S.scene], st = S.step;
  const head = `${topBar(`장면 ${S.scene + 1}/5`)}
    <div class="chart compact">${mapSvg({upto: S.scene, current: S.scene})}</div>
    <p class="eyebrow">장면 ${S.scene + 1}. ${esc(sc.where)}, ${esc(sc.year)}</p>
    <h2>${esc(sc.title)}: ${esc(sc.big)}</h2>
    <div class="steps">${STEP_NAMES.map((n, k) => `<span class="${k === st ? "on" : k < st ? "done" : ""}">${k + 1}. ${n}</span>`).join("")}</div>`;
  let body = "";
  const ch = S.choices[S.scene];
  if (st === 0) {
    body = `<div class="panel story">
      <p><button class="icon-btn" id="speak" aria-pressed="false">🔊 읽어 주기</button></p>
      ${sc.text.map(t => `<p>${terms(t)}</p>`).join("")}${photo(sc.photo)}</div>
      <div class="actions"><button class="btn ghost" data-nav="prev">이전</button><button class="btn wide" data-nav="next">다 읽었어요</button></div>`;
  } else if (st === 1) {
    body = `${sc.photo ? photo(sc.photo, true) : ""}<p class="question">${esc(sc.question)}</p>
      <div class="options">${sc.options.map((o, k) => `<button class="opt" data-opt="${k}" aria-pressed="${ch === k}"><span class="num">${k + 1}</span><span>${esc(o.text)}</span></button>`).join("")}</div>
      <p class="note" style="margin-top:12px">정답은 없어요. 톰이 되어 골라 보세요.</p>
      <div class="actions"><button class="btn ghost" data-nav="prev">이전</button><button class="btn wide" data-nav="next" ${ch === null ? "disabled" : ""}>이걸로 할래요</button></div>`;
  } else if (st === 2) {
    const r = S.reasons[S.scene];
    body = `<div class="frame">나는 <b>“${esc(sc.options[ch].text)}”</b>를 골랐다.<br>왜냐하면 ______ 때문이다.</div>
      <label for="reason" class="note">‘왜냐하면’ 다음에 올 말을 써 보세요. 아래 낱말을 눌러 넣을 수도 있어요.</label>
      <textarea id="reason" placeholder="예) 식민지에도 사람들이 살고 있기">${esc(r)}</textarea>
      <div class="chips">${sc.chips.map(c => `<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <p class="count" id="count">${len(r)}자 / 최소 ${MIN}자</p>
      <div class="actions"><button class="btn ghost" data-nav="prev">이전</button><button class="btn wide" data-nav="next" id="next-write" ${len(r) < MIN ? "disabled" : ""}>실제 역사 확인하기</button></div>`;
  } else if (st === 3) {
    const mine = sc.options[ch];
    body = `<div class="verdict ${mine.kind === "myth" ? "bad" : "good"}"><b>내 선택: “${esc(mine.text)}”</b><br>${esc(mine.fb)}</div>
      <div class="kinds">${sc.options.map((o, k) => `<div class="kind ${k === ch ? "mine" : ""}"><span class="tag ${o.kind}">${KIND_LABEL[o.kind]}</span><span>${esc(o.text)}${k === ch ? " (내 선택)" : ""}</span></div>`).join("")}</div>
      <div class="fact"><h3>실제 역사에서는</h3><p>${terms(sc.history)}</p>${photo(sc.photo2)}<p class="src">${esc(sc.src)}</p></div>
      <div class="actions"><button class="btn ghost" data-nav="prev">이전</button><button class="btn wide" data-nav="next">열쇠 문제 풀기</button></div>`;
  } else {
    const ans = S.ox[S.scene];
    const answered = ans !== null;
    const cls = v => !answered ? "" : (v === sc.ox.a ? "right" : (S._oxPick === v ? "wrong" : ""));
    body = `<p class="question">O/X 열쇠 문제</p>
      <div class="panel"><p style="font-size:21px">${esc(sc.ox.q)}</p></div>
      <div class="ox"><button data-ox="1" class="${cls(true)}" ${answered ? "disabled" : ""} aria-label="O, 맞다">O</button><button data-ox="0" class="${cls(false)}" ${answered ? "disabled" : ""} aria-label="X, 틀리다">X</button></div>
      ${answered ? `<div class="verdict ${ans ? "good" : "bad"}"><b>${ans ? "정답이에요!" : "아쉬워요."}</b> ${esc(sc.ox.ex)}</div>` : ""}
      <div class="actions"><button class="btn ghost" data-nav="prev">이전</button><button class="btn wide" id="open-card" ${answered ? "" : "disabled"}>항해 지도 열기</button></div>`;
  }
  let modal = "";
  if (S.card) {
    const c = sc.card;
    modal = `<div class="modal" role="dialog" aria-modal="true" aria-label="항해 지도 카드"><div class="card">
      <p class="eyebrow" style="margin-top:0">항해 기록 ${S.scene + 1}/5</p>
      <h2>${esc(c.name)}</h2>
      <div class="chart">${mapSvg({upto: S.scene, current: S.scene})}</div>
      <div class="owners">${c.owners.map(o => `<span>${esc(o)}</span>`).join("")}</div>
      <p><b>핵심 낱말</b>: ${esc(c.words)}</p>
      <div class="actions"><button class="btn wide" id="next-scene">${S.scene < 4 ? "다음 장면으로" : "정리 활동으로"}</button></div>
    </div></div>`;
  }
  return head + body + modal;
}

function viewMatch() {
  const m = S.match;
  const doneSet = new Set(m.done);
  return `${topBar("정리 활동")}
    <p class="eyebrow">정리 활동</p>
    <h2>어느 나라가 어디를 차지했을까?</h2>
    <p>왼쪽에서 나라를 누른 다음, 오른쪽에서 그 나라가 차지한 곳을 누르세요. 맞히면 지도에 표시돼요.</p>
    <div class="chart">${mapSvg({upto: 4, current: -2, matched: m.done})}</div>
    <div class="match">
      <div class="col">${MATCH.map((p, k) => `<button class="mbtn ${doneSet.has(p.colony) ? "done" : m.sel === k ? "sel" : ""}" data-country="${k}" ${doneSet.has(p.colony) ? "disabled" : ""}>${esc(p.country)}</button>`).join("")}</div>
      <div class="col">${COLONY_ORDER.map(k => { const c = MATCH[k].colony; return `<button class="mbtn ${doneSet.has(c) ? "done" : ""}" data-colony="${esc(c)}" ${doneSet.has(c) ? "disabled" : ""}>${esc(c)}</button>`; }).join("")}</div>
    </div>
    <p class="msg" id="match-msg">${m.done.length === 4 ? "모두 맞혔어요!" : ""}</p>
    <div class="actions"><button class="btn ghost" id="back-scene">이전</button><button class="btn wide" id="to-letter" ${m.done.length === 4 ? "" : "disabled"}>편지 쓰러 가기</button></div>`;
}

function viewLetter() {
  const L = S.letter;
  const ok = k => len(L[k]) >= MIN;
  const all = ok(0) && ok(1) && ok(2);
  const blocks = LETTER.map((b, k) => {
    const enabled = k === 0 || ok(k - 1);
    return `<div class="panel" style="${enabled ? "" : "opacity:.45"}">
      <h3>${b.title}</h3>
      <div class="frame">${esc(b.frame)}</div>
      <textarea data-letter="${k}" placeholder="${esc(b.ph)}" ${enabled ? "" : "disabled"}>${esc(L[k])}</textarea>
      <p class="count ${ok(k) ? "ok" : ""}" data-count="${k}">${len(L[k])}자 / 최소 ${MIN}자</p>
    </div>`;
  }).join("");
  return `${topBar("마무리 글")}
    <p class="eyebrow">마무리 글쓰기</p>

}
function letterText() {
  return `잭에게,\n\n${S.letter[0].trim()}\n${S.letter[1].trim()}\n${S.letter[2].trim()}\n\n1899년, 런던에서 톰이`;
}

function viewQuiz() {

  if (Q.finished) {
    const score = Q.answers.filter((a, k) => a === QUIZ[k].a).length;

      ${wrong.length ? `<br>틀린 문항: ${wrong.join(", ")}번` : ""}</div>
      <p class="note">최고 점수: ${Q.best}점</p>
      <div class="actions"><button class="btn ghost" id="quiz-retry">다시 풀기</button><button class="btn wide" id="to-self">자기 평가하기</button></div>`;
  }
  const q = QUIZ[Q.idx];

  return `${topBar("문제 풀이")}

    <div class="qopts">${q.o.map((o, k) => {
      let c = ""; if (picked !== null) { if (k === q.a) c = "right"; else if (k === picked) c = "wrong"; }
      return `<button class="qopt ${c}" data-q="${k}" ${picked !== null ? "disabled" : ""}>${"①②③④"[k]} ${esc(o)}</button>`; }).join("")}</div>
    ${picked === null ? `<p style="margin-top:12px"><button class="icon-btn" id="hint">💡 힌트 보기</button></p>${Q.hintOpen ? `<div class="fact"><p>장면 ${q.hint + 1} 「${esc(SCENES[q.hint].title)}」를 떠올려 보세요.</p><p class="src">${esc(SCENES[q.hint].summary)}</p></div>` : ""}`
      : `<div class="verdict ${picked === q.a ? "good" : "bad"}"><b>${picked === q.a ? "정답!" : "아쉬워요."}</b> ${esc(q.ex)}</div>`}
    <div class="actions"><button class="btn wide" id="q-next" ${picked === null ? "disabled" : ""}>${Q.idx < 7 ? "다음 문제" : "결과 보기"}</button></div>`;
}

/* ---------------- 이벤트 ---------------- */
function bind() {
  document.querySelectorAll(".term").forEach(b => b.onclick = () => showTerm(b.dataset.term));
  document.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => {
    const d = document.createElement("div"); d.className = "modal"; d.id = "zoom";
    d.innerHTML = `<div class="card" style="max-width:960px"><img src="${IMGS[b.dataset.zoom]}" alt="${esc(b.querySelector("img").alt)}" style="width:100%;border-radius:8px"><div class="actions"><button class="btn wide" id="zoom-close">닫기</button></div></div>`;
    document.body.appendChild(d); const c = document.getElementById("zoom-close"); c.focus();
    const close = () => d.remove(); c.onclick = close; d.onclick = e => { if (e.target === d) close(); };
  });
  const on = (sel, f) => { const el = $(sel); if (el) el.onclick = f; };

  if (S.screen === "start") {
    const check = () => {
      S.info.grade = $("#f-grade").value; S.info.cls = $("#f-cls").value;
      S.info.num = $("#f-num").value.trim(); S.info.name = $("#f-name").value.trim();
      const n = +S.info.num;
      const ok = S.info.grade && S.info.cls && n >= 1 && n <= 40 && S.info.name.length >= 2;
      $("#go").disabled = !ok; save();
    };
    ["#f-grade","#f-cls","#f-num","#f-name"].forEach(s => { $(s).oninput = check; $(s).onchange = check; });
    check();
    on("#go", () => {
      if (!S.info.date) S.info.date = new Date().toLocaleDateString("ko-KR");
      if (S.screen === "start" && !S.choices.some(c => c !== null)) { S.screen = "scene"; S.scene = 0; S.step = 0; }
      else if (S._resume) { S.screen = S._resume; }
      else { S.screen = "scene"; }
      render(); window.scrollTo(0, 0);
    });
    const r = $("#reset");
    if (r) r.onclick = () => {
      if (r.dataset.armed) { try { localStorage.removeItem(KEY); } catch(e) {} S = fresh(); render(); return; }
      r.dataset.armed = "1"; r.textContent = "정말 지울까요? 한 번 더 누르세요";
    };
  }

  if (S.screen === "scene") {
    document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => {
      if (b.dataset.nav === "next") { S.step++; }
      else { if (S.step > 0) S.step--; else if (S.scene > 0) { S.scene--; S.step = 4; } else { S._resume = "scene"; S.screen = "start"; } }
      render(); window.scrollTo(0, 0);
    });
    document.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => { S.choices[S.scene] = +b.dataset.opt; render(); });
    const sp = $("#speak"); if (sp) sp.onclick = () => toggleSpeak(sp, SCENES[S.scene].text.map(plain).join(" "));
    const ta = $("#reason");
    if (ta) {
      const upd = () => { S.reasons[S.scene] = ta.value; const n = len(ta.value); $("#count").textContent = `${n}자 / 최소 ${MIN}자`; $("#count").className = "count" + (n >= MIN ? " ok" : ""); $("#next-write").disabled = n < MIN; save(); };
      ta.oninput = upd;
      document.querySelectorAll("[data-chip]").forEach(c => c.onclick = () => { insertAt(ta, c.dataset.chip); upd(); });
    }
    document.querySelectorAll("[data-ox]").forEach(b => b.onclick = () => {
      const v = b.dataset.ox === "1"; S._oxPick = v; S.ox[S.scene] = v === SCENES[S.scene].ox.a; render();
    });
    on("#open-card", () => { S.card = true; render(); });
    on("#next-scene", () => {
      S.card = false;
      if (S.scene < 4) { S.scene++; S.step = 0; } else { S.screen = "match"; }
      render(); window.scrollTo(0, 0);
    });
  }

  if (S.screen === "match") {
    document.querySelectorAll("[data-country]").forEach(b => b.onclick = () => { S.match.sel = +b.dataset.country; render(); });
    document.querySelectorAll("[data-colony]").forEach(b => b.onclick = () => {
      const msg = $("#match-msg");
      if (S.match.sel === null) { msg.textContent = "먼저 왼쪽에서 나라를 골라 주세요."; msg.className = "msg err"; return; }
      const pair = MATCH[S.match.sel];
      if (pair.colony === b.dataset.colony) { S.match.done.push(pair.colony); S.match.sel = null; render(); }
      else { b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); msg.textContent = `${pair.country}이(가) 차지한 곳이 아니에요. 다시 생각해 보세요.`; msg.className = "msg err"; }
    });
    on("#back-scene", () => { S.screen = "scene"; S.scene = 4; S.step = 4; render(); });
    on("#to-letter", () => { S.screen = "letter"; render(); window.scrollTo(0, 0); });
  }

  if (S.screen === "letter") {
    let active = 0;
    document.querySelectorAll("[data-letter]").forEach(ta => {
      const k = +ta.dataset.letter;
      ta.onfocus = () => { active = k; };
      ta.oninput = () => { S.letter[k] = ta.value; refreshLetter(); };
    });
    document.querySelectorAll("[data-lchip]").forEach(c => c.onclick = () => {
      const ta = document.querySelector(`[data-letter="${active}"]`);
      if (!ta || ta.disabled) return;
      insertAt(ta, c.dataset.lchip); S.letter[active] = ta.value; refreshLetter();
    });
    on("#back-match", () => { S.screen = "match"; render(); });
    on("#to-quiz", () => { S.screen = "quiz"; render(); window.scrollTo(0, 0); });
  }

  if (S.screen === "quiz") {
    const Q = S.quiz;
    document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { Q.picked = +b.dataset.q; Q.answers[Q.idx] = Q.picked; render(); });
    on("#hint", () => { Q.hintOpen = !Q.hintOpen; render(); });
    on("#q-next", () => {
      Q.hintOpen = false;
      if (Q.idx < 7) { Q.idx++; Q.picked = null; }
      else {
        Q.finished = true;
        const sc = Q.answers.filter((a, k) => a === QUIZ[k].a).length;
        if (Q.best === null || sc >= Q.best) { Q.best = sc; Q.bestAnswers = Q.answers.slice(); }
      }
      render(); window.scrollTo(0, 0);
    });
    on("#quiz-retry", () => { Object.assign(Q, {idx:0, answers:[], picked:null, finished:false, hintOpen:false}); render(); });
    on("#to-self", () => { S.screen = "self"; render(); window.scrollTo(0, 0); });
  }

  if (S.screen === "self") {
    document.querySelectorAll("[data-star]").forEach(b => b.onclick = () => { S.self.stars = +b.dataset.star; render(); });
    const n = $("#self-note"); n.oninput = () => { S.self.note = n.value; save(); };
    on("#back-quiz", () => { S.screen = "quiz"; render(); });
    on("#to-result", () => { S.screen = "result"; render(); window.scrollTo(0, 0); });
  }

  if (S.screen === "result") {
    on("#pdf", makePdf);
    on("#copy", copyText);
    on("#edit-letter", () => { S.screen = "letter"; render(); });
    on("#back-self", () => { S.screen = "self"; render(); });
  }
}

function refreshLetter() {
  LETTER.forEach((_, k) => {
    const c = document.querySelector(`[data-count="${k}"]`); const n = len(S.letter[k]);
    c.textContent = `${n}자 / 최소 ${MIN}자`; c.className = "count" + (n >= MIN ? " ok" : "");
    const ta = document.querySelector(`[data-letter="${k}"]`);
    const enabled = k === 0 || len(S.letter[k - 1]) >= MIN;
    ta.disabled = !enabled; ta.parentElement.style.opacity = enabled ? "" : ".45";
  });
  const all = S.letter.every(t => len(t) >= MIN);
  $("#to-quiz").disabled = !all;
  $("#letter-preview-wrap").innerHTML = all ? letterPreview() : "";
  save();
}

function insertAt(ta, word) {
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const pad = before && !/\s$/.test(before) ? " " : "";
  ta.value = before + pad + word + " " + after;
  const pos = (before + pad + word + " ").length;
  ta.focus(); try { ta.setSelectionRange(pos, pos); } catch(e) {}
}

/* 낱말 뜻 */

  closeSheet();

}
function closeSheet() { const s = $("#sheet"); if (s) s.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); const z = document.getElementById("zoom"); if (z) z.remove(); } });

/* 읽어 주기 */
function stopSpeak() { try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch(e) {} }
function toggleSpeak(btn, text) {
  if (!("speechSynthesis" in window)) { btn.textContent = "이 기기에서는 읽어 주기를 쓸 수 없어요"; btn.disabled = true; return; }
  if (btn.getAttribute("aria-pressed") === "true") { stopSpeak(); btn.setAttribute("aria-pressed", "false"); btn.textContent = "🔊 읽어 주기"; return; }
  const u = new SpeechSynthesisUtterance(text.replace(/[“”‘’]/g, ""));
  u.lang = "ko-KR"; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("ko")); if (v) u.voice = v;
  u.onend = () => { btn.setAttribute("aria-pressed", "false"); btn.textContent = "🔊 읽어 주기"; };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  btn.setAttribute("aria-pressed", "true"); btn.textContent = "■ 멈추기";
}

function missingParts() {
  const miss = [];
  if (S.choices.some(c => c === null) || S.reasons.some(r => len(r) < MIN)) miss.push("장면별 선택과 이유");
  if (S.letter.some(t => len(t) < MIN)) miss.push("톰의 편지");
  if (S.quiz.best === null) miss.push("확인 문제");
  if (!S.self.stars) miss.push("자기 평가");
  return miss;
}

async function makePdf() {
  const msg = $("#pdf-msg"), btn = $("#pdf");
  const miss = missingParts();
  if (miss.length) { msg.className = "msg err"; msg.textContent = `아직 끝내지 않은 부분이 있어요: ${miss.join(", ")}`; return; }
  if (!window.html2canvas || !window.jspdf) { msg.className = "msg err"; msg.textContent = "PDF 도구를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요."; return; }
  btn.disabled = true; msg.className = "msg"; msg.textContent = "PDF를 만들고 있어요…";
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const els = buildReport();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:"mm", format:"a4", orientation:"p"});
    const M = 14, W = 210 - M * 2, H = 297 - M * 2 - 6;
    let y = M;
    for (const el of els) {
      const cv = await html2canvas(el, {scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false});
      let h = cv.height * W / cv.width;
      if (h <= H) {
        if (y + h > M + H && y > M) { pdf.addPage(); y = M; }
        pdf.addImage(cv.toDataURL("image/jpeg", 0.92), "JPEG", M, y, W, h); y += h + 3;
      } else {
        const pxPerMm = cv.width / W; let off = 0;
        while (off < cv.height) {
          if (y > M) { pdf.addPage(); y = M; }
          const sliceH = Math.min(cv.height - off, Math.floor(H * pxPerMm));
          const c2 = document.createElement("canvas"); c2.width = cv.width; c2.height = sliceH;
          c2.getContext("2d").drawImage(cv, 0, off, cv.width, sliceH, 0, 0, cv.width, sliceH);
          const hh = sliceH / pxPerMm;
          pdf.addImage(c2.toDataURL("image/jpeg", 0.92), "JPEG", M, y, W, hh); y += hh + 3; off += sliceH;
        }
      }
    }
    const n = pdf.getNumberOfPages();
    for (let p = 1; p <= n; p++) { pdf.setPage(p); pdf.setFontSize(9); pdf.setTextColor(120); pdf.text(`${p} / ${n}`, 105, 290, {align:"center"}); }
    const blob = pdf.output("blob");
    const name = fileName();
    const dl = await getDownloads();
    if (dl) {
      try { await dl.save({filename:name, data:blob}); msg.className = "msg ok"; msg.textContent = `저장했어요: ${name}`; }
      catch (err) {
        if (err && err.code === "declined") { msg.className = "msg"; msg.textContent = "저장을 취소했어요. 다시 누르면 저장할 수 있어요."; }
        else if (err && err.code === "rate_limited") { msg.className = "msg err"; msg.textContent = "잠시 뒤에 다시 눌러 주세요."; }
        else { fallbackSave(blob, name); msg.className = "msg ok"; msg.textContent = `PDF를 내려받았어요: ${name}`; }
      }
    } else {
      fallbackSave(blob, name); msg.className = "msg ok"; msg.textContent = `PDF를 내려받았어요: ${name}`;
    }
  } catch (e) {
    msg.className = "msg err"; msg.textContent = "PDF를 만들지 못했어요. 다시 눌러 보거나, ‘내용 복사’로 제출해 주세요.";
  } finally { btn.disabled = false; $("#report").innerHTML = ""; }
}
function fallbackSave(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

function copyText() {
  const i = S.info, w = quizWrong();
  const lines = [`1897년, 증기선을 탄 소년: 활동 기록`, `${i.grade}학년 ${i.cls}반 ${i.num}번 ${i.name} (${i.date})`, ""];
  SCENES.forEach((sc, k) => {
    const o = sc.options[S.choices[k]];
    lines.push(`[장면 ${k + 1}] ${sc.title}`, `내 선택: ${o.text} (${KIND_LABEL[o.kind]})`, `이유: 왜냐하면 ${S.reasons[k]}`, `실제 역사: ${sc.summary}`, "");
  });
  lines.push("[톰의 편지]", letterText(), "", `[확인 문제] ${quizScore()}점 / 8점${w.length ? `, 틀린 문항 ${w.join(", ")}번` : ""}`, `[자기 평가] ${"★".repeat(S.self.stars)} ${S.self.note}`);
  const text = lines.join("\n");
  const msg = $("#pdf-msg");
  const done = () => { msg.className = "msg ok"; msg.textContent = "복사했어요. 제출할 곳에 붙여 넣으세요."; };
  const manual = () => {
    msg.className = "msg"; msg.innerHTML = `자동 복사가 되지 않았어요. 아래 내용을 길게 눌러 모두 선택한 뒤 복사하세요.<textarea readonly style="margin-top:8px;min-height:200px">${esc(text)}</textarea>`;
    const t = msg.querySelector("textarea"); t.focus(); t.select();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, manual); else manual();
}

render();
</script>
